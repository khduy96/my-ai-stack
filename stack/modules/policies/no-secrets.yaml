id: no-secrets
kind: policy
version: 0.1.0
kernel: ^0.5
tags: [core, guard]
description: >-
  Refuses writes that put a secret into a file: cloud and API keys, tokens, private
  keys, or long literal values assigned to names like password or api_key.
  Placeholders and files matching `ignore` are allowed.
config:
  ignore:
    - '**/*.example'
    - '**/*.sample'
    - '**/.env.example'
rule: >-
  Never write secrets (keys, tokens, passwords, private keys) into files; read them
  from the environment or the project's secret store, and use obvious placeholders
  in examples.
guard:
  event: PreToolUse
  matcher: Edit|Write|MultiEdit
  script: no-secrets.mjs

id: memory-update
kind: flow
version: 0.1.0
kernel: ^1
tags: [core, knowledge]
description: >-
  Refreshes the project's memory bank with the archivist after a significant change:
  current focus, recent changes, progress and open work from git, and a decision
  entry when an architectural choice was made. Use at the end of a task or session,
  or after a flow run.
argument_hint: "[run directory | note]"

input:
  description: >-
    Nothing (the archivist reads git), a finished run directory (for example
    .ai-runs/20261021-1520-feature-x) whose handoffs to learn from, or a note in the
    user's words, such as a decision that was just made.
  default: Refresh from git since the last update.

steps:
  - id: update
    agent: archivist
    goal: >-
      Mode update. Bring the memory bank up to date with what changed since its last
      update, using git and the input.
    in:
      source: $input
    gate: on-questions

report: >-
  List the memory bank files updated, each with what changed in one line, then any
  new decision entry in full, then the [?] items the user should confirm. Show the
  changes for review: `git diff -- <dir>` when the directory is tracked, otherwise the
  edited sections before and after. Never stage or commit them.
